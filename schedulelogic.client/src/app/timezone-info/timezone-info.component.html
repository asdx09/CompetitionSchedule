<div class="box">
  <div class="eyebrow">Start</div>
  <h2>{{ eventTypeName }}</h2>
  <dl>
    <dt>Time</dt><dd>{{ time }}</dd>
    <dt>Competitor</dt><dd>{{ participantName }}</dd>
    @if (groupName) {<dt>Group</dt><dd>{{ groupName }}</dd>}
    <dt>Location</dt><dd>{{ locationName }}</dd>
  </dl>
  <button type="button" (click)="dialogRef.close()">Close</button>
</div>
