<div class="profile-dialog">

  <div class="profile-icon">
    {{ data.name?.charAt(0)?.toUpperCase() }}
  </div>

  <h2>Profile</h2>

  <p class="username">
    {{ data.name }}
  </p>

  <div class="actions">

        <button class="primary-button" (click)="logout()">
        Logout
        </button>

        <button class="danger-button" (click)="deleteAccount()">
        Delete account
        </button>

  </div>

</div>
