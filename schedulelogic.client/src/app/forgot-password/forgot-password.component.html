<div class="background">
  <div class="auth-form">
    <h2>Forgot Password</h2>

    <ng-container *ngIf="!submitted; else doneMsg">

      <p>
        Enter your username or e-mail address and we will send you a link
        to reset your password.
      </p>

      <form (ngSubmit)="onSubmit()">
        <input
          type="text"
          name="usernameOrEmail"
          [(ngModel)]="usernameOrEmail"
          placeholder="Username or e-mail"
          required
        />

        <button type="submit" [disabled]="loading">
          {{ loading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>

      <a routerLink="/login">Back to Login</a>

    </ng-container>

    <ng-template #doneMsg>

      <p>
        If an account exists with the provided information, we have sent
        a password reset link to the associated e-mail address.
        The link is valid for 1 hour.
      </p>

      <a routerLink="/login">Back to Login</a>

    </ng-template>
  </div>
</div>
